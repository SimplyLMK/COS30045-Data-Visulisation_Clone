<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>D3 Charts Dashboard - TV Power Consumption</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://d3js.org/d3.v7.min.js"></script>
</head>
<body>
  <header>
    <h1>D3 Charts Dashboard</h1>
    <p>TV power consumption analysis using D3.js</p>
  </header>

  <main>
    <section class="chart-card">
      <h2>Energy Consumption vs Star Rating</h2>
      <div id="scatter"></div>
    </section>

    <section class="chart-card">
      <h2>Spot Power Prices (1998–2024)</h2>
      <div id="line"></div>
    </section>

    <section class="chart-card">
      <h2>Mean Energy Consumption (55-inch TVs)</h2>
      <div id="bar"></div>
    </section>

    <section class="chart-card">
      <h2>Energy Consumption by Screen Technology (All Sizes)</h2>
      <div id="donut"></div>
    </section>
  </main>

  <script src="js/scatter.js"></script>
  <script src="js/line.js"></script>
  <script src="js/bar.js"></script>
  <script src="js/donut.js"></script>
</body>
</html>
