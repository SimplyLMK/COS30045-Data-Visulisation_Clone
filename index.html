<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Exercise 4 - SVG House</title>
<style>
  body {
    font-family: Arial, sans-serif;
    margin: 20px;
  }
  h2 {
    margin-top: 40px;
    color: #333;
  }
  .row {
    display: flex;
    gap: 20px;
    align-items: flex-start;
  }
  img, svg {
    border: 1px solid #aaa;
    box-shadow: 0 2px 5px rgba(0,0,0,0.1);
  }
</style>


  <!-- Step 1 -->
  <h2>SVG House</h2>
  <div class="row">
    <!-- Non-annotated SVG -->
    <svg width="600" height="400">
      <!-- Ground -->
      <rect x="0" y="300" width="600" height="100" fill="lightgreen" />
      <!-- House body -->
      <rect x="200" y="150" width="200" height="150" fill="burlywood" stroke="black" stroke-width="2" />
      <!-- Roof -->
      <polygon points="200,150 400,150 300,80" fill="firebrick" stroke="black" stroke-width="2"/>
      <!-- Door -->
      <rect x="280" y="230" width="40" height="70" fill="saddlebrown" stroke="black" />
      <!-- Windows -->
      <rect x="220" y="180" width="40" height="40" fill="skyblue" stroke="black" />
      <rect x="340" y="180" width="40" height="40" fill="skyblue" stroke="black" />
      <!-- Path -->
      <path d="M300 300 Q290 350 260 400" stroke="gray" stroke-width="4" fill="none" />
      <!-- Tree -->
      <rect x="450" y="220" width="20" height="80" fill="sienna" />
      <circle cx="460" cy="200" r="40" fill="darkgreen" />
      <!-- Sun -->
      <circle cx="80" cy="80" r="40" fill="gold" />
      <!-- Text -->
      <text x="240" y="370" font-size="20" fill="black">My House</text>
    </svg>

    <!-- Step 2: Annotated version -->
    <div>
      <h3>Annotated Coordinates</h3>
      
      <img src="image/annotated.png" alt="Annotated SVG example" width="600">
    </div>
  </div>

<!-- Step 3 and 4–5 -->
<h2>Step 3: Customised SVG (with Step 4–5 DOM Screenshot)</h2>
<div class="row">
  <!-- Customised SVG on the left -->
  <svg width="600" height="400">
    <rect x="0" y="300" width="600" height="100" fill="lightgreen" />
    <!-- House body (new color) -->
    <rect x="200" y="150" width="200" height="150" fill="lightblue" stroke="black" stroke-width="2" />
    <!-- Roof -->
    <polygon points="200,150 400,150 300,80" fill="firebrick" stroke="black" stroke-width="2"/>
    <!-- Chimney -->
    <rect x="360" y="100" width="20" height="50" fill="gray" />
    <!-- Grouped Windows -->
    <g id="windows" transform="translate(0,10)" stroke="black" fill="skyblue">
      <rect x="220" y="180" width="40" height="40" />
      <rect x="340" y="180" width="40" height="40" />
    </g>
    <!-- Door -->
    <rect x="280" y="230" width="40" height="70" fill="saddlebrown" stroke="black" />
    <!-- Path -->
    <path d="M300 300 Q300 350 290 400" stroke="gray" stroke-width="4" fill="none" />
    <!-- Tree -->
    <rect x="460" y="220" width="20" height="80" fill="sienna" />
    <circle cx="470" cy="200" r="40" fill="darkgreen" />
    <!-- Sun -->
    <circle cx="80" cy="80" r="40" fill="orange" />
    <!-- Text -->
    <text x="230" y="380" font-size="20" fill="black">My Customised House</text>
  </svg>

  <!-- DOM screenshot on the right -->
  <div>
    <h3>DOM View</h3>

    <img src="image/dom.png" alt="DOM view showing grouped SVG elements" width="600">
  </div>
</div>



</body>
</html>
